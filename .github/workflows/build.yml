name: Build RSDKv5 iOS Plus

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/build.yml

jobs:
  v5-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout RSDKv5
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout Sonic Mania Decompilation
        uses: actions/checkout@v4
        with:
          repository: "RSDKModding/Sonic-Mania-Decompilation"
          path: "Sonic-Mania-Decompilation"

      - name: Link Sonic Mania Game Code
        run: |
          rm -rf Game
          rm -rf Sonic-Mania-Decompilation/dependencies/RSDKv5
          ln -s "$PWD" "$PWD/Sonic-Mania-Decompilation/dependencies/RSDKv5"
          ln -s "$PWD/Sonic-Mania-Decompilation" "$PWD/Game"

      - name: Build iOS App
        run: |
          xcodebuild \
            -project RSDKv5.xcodeproj \
            -scheme RSDKv5 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            GCC_PREPROCESSOR_DEFINITIONS='$(inherited) RETRO_REVISION=2 RETRO_DISABLE_PLUS=0'

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r RSDKv5-ManiaPlus.ipa Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: RSDKv5-ManiaPlus-iOS
          path: RSDKv5-ManiaPlus.ipa
